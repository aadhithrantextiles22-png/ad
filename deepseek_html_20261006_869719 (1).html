const monthlyState = { month: todayISO().slice(0,7), week: todayISO() };

function renderFilterBar () {
  const skipDate = (currentReport === 'recurring' || currentReport === 'monthly' || currentReport === 'weekly');
  if (skipDate) {
    $('#filterRow').innerHTML = '';
    $('#customDateRow').classList.remove('on');
    renderMonthNav();
    return;
  }
  $('#monthNavWrap').innerHTML = '';
  const presets = [
    { k: 'today', l: 'Today' }, { k: 'yesterday', l: 'Yesterday' },
    { k: '7d', l: '7 days' }, { k: '30d', l: '30 days' },
    { k: 'month', l: 'This month' }, { k: 'last_month', l: 'Last month' }, { k: 'all', l: 'All time' },
  ];
  const isPreset = filterState.dateType === 'preset';
  const isCustom = filterState.dateType === 'custom';
  $('#filterRow').innerHTML =
    presets.map(p => `<button class="filter-chip ${isPreset && filterState.preset === p.k ? 'on' : ''}" data-preset="${p.k}">${p.l}</button>`).join('') +
    `<button class="filter-chip ${isCustom ? 'on' : ''}" data-preset="custom">📅 Custom</button>`;
  $$('#filterRow [data-preset]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.preset;
    if (v === 'custom') {
      filterState.dateType = 'custom';
      if (!filterState.from) filterState.from = todayISO();
      if (!filterState.to) filterState.to = todayISO();
    } else { filterState.dateType = 'preset'; filterState.preset = v; }
    renderFilterBar(); renderCustomDateRow(); renderActiveFilters(); renderReportContent();
  }));
  const row = $('#customDateRow');
  if (isCustom) {
    row.classList.add('on');
    const f = $('#filterFrom'); if (f) f.value = filterState.from || todayISO();
    const t = $('#filterTo');   if (t) t.value = filterState.to   || todayISO();
  } else row.classList.remove('on');
  attachRipple();
}
function renderMonthNav () {
  const wrap = $('#monthNavWrap');
  if (!wrap) return;
  if (currentReport === 'monthly') {
    const [y, m] = monthlyState.month.split('-').map(Number);
    const label = new Date(y, m-1, 1).toLocaleDateString('en-IN', { month:'long', year:'numeric' });
    wrap.innerHTML = `<div class="month-nav">
      <button id="mnPrev">‹</button>
      <div class="mn-lbl">${label}</div>
      <button id="mnNext">›</button>
    </div>`;
    setTimeout(() => {
      $('#mnPrev').addEventListener('click', () => {
        const d = new Date(y, m-2, 1);
        monthlyState.month = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
        renderMonthNav(); renderReportContent();
      });
      $('#mnNext').addEventListener('click', () => {
        const d = new Date(y, m, 1);
        monthlyState.month = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
        renderMonthNav(); renderReportContent();
      });
    }, 30);
  } else if (currentReport === 'weekly') {
    const anchor = new Date(monthlyState.week + 'T00:00:00');
    const dow = anchor.getDay();
    const monOff = dow === 0 ? -6 : 1 - dow;
    const mon = new Date(anchor); mon.setDate(anchor.getDate() + monOff);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const label = dateDisplay(isoLocal(mon)) + ' → ' + dateDisplay(isoLocal(sun));
    wrap.innerHTML = `<div class="month-nav">
      <button id="wkPrev">‹</button>
      <div class="mn-lbl">${label}</div>
      <button id="wkNext">›</button>
    </div>`;
    setTimeout(() => {
      $('#wkPrev').addEventListener('click', () => {
        const d = new Date(anchor); d.setDate(d.getDate()-7);
        monthlyState.week = isoLocal(d);
        renderMonthNav(); renderReportContent();
      });
      $('#wkNext').addEventListener('click', () => {
        const d = new Date(anchor); d.setDate(d.getDate()+7);
        monthlyState.week = isoLocal(d);
        renderMonthNav(); renderReportContent();
      });
    }, 30);
  } else wrap.innerHTML = '';
}
function renderCustomDateRow () {
  const row = $('#customDateRow'), f = $('#filterFrom'), t = $('#filterTo');
  if (filterState.dateType !== 'custom') { row.classList.remove('on'); return; }
  row.classList.add('on');
  f.value = filterState.from || todayISO(); t.value = filterState.to || todayISO();
  f.onchange = () => { filterState.from = f.value || todayISO(); renderActiveFilters(); renderReportContent(); };
  t.onchange = () => { filterState.to = t.value || todayISO(); renderActiveFilters(); renderReportContent(); };
}
function renderActiveFilters () {
  const strip = $('#activeFilterStrip');
  if (!strip) return;
  if (currentReport === 'recurring' || currentReport === 'monthly' || currentReport === 'weekly') { strip.innerHTML = ''; return; }
  const { from, to } = resolveDateRange();
  strip.innerHTML = `<span>📅 <b>${from === to ? dateDisplay(from) : dateDisplay(from) + ' → ' + dateDisplay(to)}</b></span>`;
}

function renderReportContent () {
  const id = currentReport;
  const content = $('#reportContent');
  if (!id) { content.innerHTML = ''; return; }
  if (id === 'recurring') {
    content.innerHTML = buildRecurringReport();
    attachRipple();
    setTimeout(() => {
      $$('#reportContent [data-rid]').forEach(el => el.addEventListener('click', () => openRecurringForm(DB.recurring.find(r => r.id === el.dataset.rid))));
      const add = $('#addRecurBtn2'); if (add) add.addEventListener('click', () => openRecurringForm(null));
    }, 60);
    return;
  }
  if (id === 'monthly') { content.innerHTML = buildMonthlyGrid(); attachRipple(); return; }
  if (id === 'weekly')  { content.innerHTML = buildWeeklyGrid();  attachRipple(); return; }
  if (id === 'advance') { content.innerHTML = buildAdvanceLedger(); attachRipple(); return; }
  if (id === 'pnl') {
    if (!isAccount()) { content.innerHTML = emptyState('i-lock','Account only','Sign in as Account to view Profit & Loss.'); return; }
    content.innerHTML = buildPnlReport(); attachRipple(); return;
  }
  const rows = applyFilters(DB.production);
  const exps = applyExpenseFilters(DB.expenses);
  const { from, to } = resolveDateRange();
  const hours = DB.staffHours.filter(h => h.date >= from && h.date <= to);
  if (id === 'salary')       content.innerHTML = buildSalaryReport(rows, from, to);
  else if (id === 'staffhours') content.innerHTML = buildStaffHoursReport(hours, from, to);
  else if (id === 'expense') content.innerHTML = buildExpenseReport(exps);
  else if (id === 'daily')   content.innerHTML = buildDailyReport(rows);
  else if (id === 'operator') content.innerHTML = buildOperatorReport(rows);
  else if (id === 'bundle')  content.innerHTML = buildBundleReport(rows);
  else if (id === 'operation') content.innerHTML = buildOperationReport(rows);
  attachRipple();
}

function buildAdvanceLedger () {
  const { from, to } = resolveDateRange();
  const periodAdvances = DB.advances.filter(a => a.date >= from && a.date <= to);
  const periodTotal = periodAdvances.reduce((s, a) => s + a.amount, 0);
  const periodSettled = periodAdvances.filter(a => a.settled).reduce((s, a) => s + a.amount, 0);
  const outstandingAllTime = DB.advances.filter(a => !a.settled).reduce((s, a) => s + a.amount, 0);
  const outstandingCount = DB.advances.filter(a => !a.settled).length;
  const byPerson = {};
  DB.advances.forEach(a => {
    const key = a.personType + ':' + a.personId;
    if (!byPerson[key]) byPerson[key] = {
      personType: a.personType, personId: a.personId, personName: a.personName,
      entries: [], outstanding: 0, total: 0,
    };
    byPerson[key].entries.push(a);
    byPerson[key].total += a.amount;
    if (!a.settled) byPerson[key].outstanding += a.amount;
  });
  const list = Object.values(byPerson).sort((a,b) => {
    if (a.outstanding !== b.outstanding) return b.outstanding - a.outstanding;
    return b.total - a.total;
  });
  const unsettledPeople = list.filter(p => p.outstanding > 0).length;
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#DC2626,#EF4444)">
      <div class="rh-l">Outstanding Advances</div>
      <div class="rh-v">${money(outstandingAllTime)}</div>
      <div class="rh-s">${unsettledPeople} ${unsettledPeople === 1 ? 'person owes' : 'people owe'} · ${outstandingCount} unsettled ${outstandingCount === 1 ? 'entry' : 'entries'}</div>
      <div class="rh-row">
        <div class="rh-stat"><div class="rl">Issued (period)</div><div class="rv">${money(periodTotal)}</div></div>
        <div class="rh-stat"><div class="rl">Settled (period)</div><div class="rv">${money(periodSettled)}</div></div>
      </div>
    </div>
    <div style="padding:0 16px 10px"><button class="btn red lg" onclick="openAddAdvance()">${icon('i-plus')} Record Advance Payment</button></div>
    ${list.length ? list.map(p => renderAdvancePersonCard(p, from, to)).join('') : emptyState('i-hand', 'No advances yet', 'Tap "Record Advance Payment" to start the ledger.')}
  `;
}
function renderAdvancePersonCard (p, from, to) {
  const periodAmt = p.entries.filter(a => a.date >= from && a.date <= to).reduce((s, a) => s + a.amount, 0);
  const typeLabel = p.personType === 'operator' ? 'Operator' : 'Company Staff';
  const badge = p.outstanding > 0
    ? `<span style="background:#FEE2E2;color:#991B1B;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:800">OUTSTANDING</span>`
    : `<span style="background:var(--emerald-lt);color:var(--emerald-dk);padding:2px 8px;border-radius:100px;font-size:10px;font-weight:800">CLEARED</span>`;
  const sortedEntries = [...p.entries].sort((a,b) => b.date.localeCompare(a.date));
  return `
    <div class="salary-section">
      <div class="salary-emp" onclick="this.classList.toggle('expanded')">
        <div class="se-top">
          <div class="se-av" style="background:linear-gradient(135deg,#DC2626,#EF4444)">${initials(p.personName)}</div>
          <div class="se-body">
            <div class="se-name">${escapeHtml(p.personName)}</div>
            <div class="se-info">${typeLabel} · ${p.entries.length} entr${p.entries.length === 1 ? 'y' : 'ies'}${periodAmt > 0 ? ' · ' + money(periodAmt) + ' in period' : ''}</div>
          </div>
          <div class="se-amt">
            <div class="se-net" style="color:${p.outstanding > 0 ? 'var(--red)' : 'var(--emerald-dk)'}">${money(p.outstanding)}</div>
            <div class="se-gross">${badge}</div>
          </div>
          <svg class="se-arrow"><use href="#i-chev-down"/></svg>
        </div>
        <div class="se-ops">
          ${sortedEntries.map(a => `
            <div class="op-line" style="align-items:center">
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dateShort(a.date)}${a.note ? ' · ' + escapeHtml(a.note) : ''}</span>
              <span style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                <b style="color:${a.settled ? 'var(--emerald-dk)' : 'var(--red)'}">${money(a.amount)}</b>
                <button type="button" class="adv-set-chip ${a.settled ? 'on' : 'out'}" onclick="event.stopPropagation();toggleAdvanceSettled('${a.id}')">${a.settled ? '✓ SETTLED' : 'OUTSTANDING'}</button>
                <button type="button" onclick="event.stopPropagation();deleteAdvance('${a.id}')" style="width:22px;height:22px;border-radius:6px;background:rgba(220,38,38,.1);color:var(--red);display:grid;place-items:center;font-size:14px;border:none;cursor:pointer">×</button>
              </span>
            </div>
          `).join('')}
          <div class="op-line op-tot"><span>Total advances</span><span>${money(p.total)}</span></div>
        </div>
      </div>
    </div>
  `;
}

function buildMonthlyGrid () {
  const month = monthlyState.month || todayISO().slice(0,7);
  const [y, m] = month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const days = Array.from({ length: daysInMonth }, (_, i) => {
    const d = new Date(y, m-1, i+1);
    return { day: i+1, date: isoLocal(d), dow: d.getDay() };
  });
  const prodByEmp = {}, piecesByEmp = {};
  DB.production.forEach(p => {
    if (p.date.slice(0,7) !== month) return;
    if (!prodByEmp[p.empId]) prodByEmp[p.empId] = {};
    prodByEmp[p.empId][p.date] = (prodByEmp[p.empId][p.date] || 0) + (Number(p.amount) || 0);
    piecesByEmp[p.empId] = (piecesByEmp[p.empId] || 0) + p.qty;
  });
  const staffByRow = {};
  DB.staffHours.forEach(h => {
    if (h.date.slice(0,7) !== month) return;
    if (!staffByRow[h.staffId]) staffByRow[h.staffId] = {};
    staffByRow[h.staffId][h.date] = (staffByRow[h.staffId][h.date] || 0) + (Number(h.amount) || 0);
  });
  const operatorTotal = Object.values(prodByEmp).reduce((acc, byDate) => acc + Object.values(byDate).reduce((a,b) => a+b, 0), 0);
  const staffTotal = Object.values(staffByRow).reduce((acc, byDate) => acc + Object.values(byDate).reduce((a,b) => a+b, 0), 0);
  const grandTotal = operatorTotal + staffTotal;
  const totalPieces = Object.values(piecesByEmp).reduce((a,b) => a + b, 0);
  const headCols = days.map(d => `<th class="${(d.dow===0||d.dow===6)?'weekend-col':''}">${d.day}<br><span style="font-size:8px;opacity:.85">${['S','M','T','W','T','F','S'][d.dow]}</span></th>`).join('');
  const operatorRows = DB.employees.map(emp => {
    const byDate = prodByEmp[emp.id] || {};
    let rowTotal = 0;
    const cells = days.map(d => {
      const amt = byDate[d.date] || 0;
      const wknd = (d.dow===0||d.dow===6)?'weekend-col':'';
      if (amt > 0) { rowTotal += amt; return `<td class="has-val ${wknd}">${Math.round(amt)}</td>`; }
      return `<td class="zero ${wknd}">–</td>`;
    }).join('');
    const pcs = piecesByEmp[emp.id] || 0;
    if (rowTotal === 0 && pcs === 0) return '';
    return `<tr><td>${escapeHtml(emp.name)}<div style="font-size:9px;color:var(--text-3);font-weight:500">${pcs} pcs</div></td>${cells}<td class="grid-total-col">₹${Math.round(rowTotal).toLocaleString('en-IN')}</td></tr>`;
  }).join('');
  const staffRows = DB.companyStaff.map(s => {
    const byDate = staffByRow[s.id] || {};
    let rowTotal = 0;
    const cells = days.map(d => {
      const amt = byDate[d.date] || 0;
      const wknd = (d.dow===0||d.dow===6)?'weekend-col':'';
      if (amt > 0) { rowTotal += amt; return `<td class="has-val ${wknd}">${Math.round(amt)}</td>`; }
      return `<td class="zero ${wknd}">–</td>`;
    }).join('');
    if (rowTotal === 0) return '';
    return `<tr><td><span style="color:var(--purple)">👤 ${escapeHtml(s.name)}</span><div style="font-size:9px;color:var(--text-3);font-weight:500">${escapeHtml(s.role||'')}</div></td>${cells}<td class="grid-total-col">₹${Math.round(rowTotal).toLocaleString('en-IN')}</td></tr>`;
  }).join('');
  if (!operatorRows && !staffRows) {
    return emptyState('i-grid', 'No data for ' + month, 'No production or hours logged this month.');
  }
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#7C3AED,#A855F7)">
      <div class="rh-l">Monthly Total · ${month}</div>
      <div class="rh-v">${money(grandTotal)}</div>
      <div class="rh-s">${totalPieces.toLocaleString('en-IN')} pieces · ${daysInMonth} days</div>
      <div class="rh-row">
        <div class="rh-stat"><div class="rl">Operators</div><div class="rv">${money(operatorTotal)}</div></div>
        <div class="rh-stat"><div class="rl">Staff</div><div class="rv">${money(staffTotal)}</div></div>
      </div>
    </div>
    <div class="hint" style="margin:0 16px 8px">Scroll right to see all days. Weekend columns tinted orange.</div>
    <div class="grid-scroll">
      <table class="grid-table">
        <thead><tr><th>Name</th>${headCols}<th style="background:linear-gradient(180deg,#ECFDF5,#D1FAE5);color:#065F46">Total</th></tr></thead>
        <tbody>${operatorRows}${staffRows}</tbody>
      </table>
    </div>
  `;
}

function buildWeeklyGrid () {
  const anchor = new Date((monthlyState.week || todayISO()) + 'T00:00:00');
  const dow = anchor.getDay();
  const monOff = dow === 0 ? -6 : 1 - dow;
  const mon = new Date(anchor); mon.setDate(anchor.getDate() + monOff);
  const weekDays = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    return { date: isoLocal(d), dow: d.getDay(), label: d.toLocaleDateString('en-IN', { weekday:'short' }), day: d.getDate() };
  });
  const from = weekDays[0].date, to = weekDays[6].date;
  const prodByEmp = {}, staffByRow = {};
  DB.production.forEach(p => {
    if (p.date < from || p.date > to) return;
    if (!prodByEmp[p.empId]) prodByEmp[p.empId] = {};
    prodByEmp[p.empId][p.date] = (prodByEmp[p.empId][p.date] || 0) + (Number(p.amount) || 0);
  });
  DB.staffHours.forEach(h => {
    if (h.date < from || h.date > to) return;
    if (!staffByRow[h.staffId]) staffByRow[h.staffId] = {};
    staffByRow[h.staffId][h.date] = (staffByRow[h.staffId][h.date] || 0) + (Number(h.amount) || 0);
  });
  const operatorTotal = Object.values(prodByEmp).reduce((a, d) => a + Object.values(d).reduce((x,y) => x+y, 0), 0);
  const staffTotal = Object.values(staffByRow).reduce((a, d) => a + Object.values(d).reduce((x,y) => x+y, 0), 0);
  const grandTotal = operatorTotal + staffTotal;
  const headCols = weekDays.map(d => `<th class="${d.dow===0||d.dow===6?'weekend-col':''}">${d.label}<br><span style="font-size:8px;opacity:.85">${d.day}</span></th>`).join('');
  const opRows = DB.employees.map(emp => {
    const byDate = prodByEmp[emp.id] || {};
    let total = 0;
    const cells = weekDays.map(d => {
      const amt = byDate[d.date] || 0;
      const wknd = (d.dow===0||d.dow===6)?'weekend-col':'';
      if (amt > 0) { total += amt; return `<td class="has-val ${wknd}">${Math.round(amt)}</td>`; }
      return `<td class="zero ${wknd}">–</td>`;
    }).join('');
    if (total === 0) return '';
    return `<tr><td>${escapeHtml(emp.name)}</td>${cells}<td class="grid-total-col">₹${Math.round(total).toLocaleString('en-IN')}</td></tr>`;
  }).join('');
  const stRows = DB.companyStaff.map(s => {
    const byDate = staffByRow[s.id] || {};
    let total = 0;
    const cells = weekDays.map(d => {
      const amt = byDate[d.date] || 0;
      const wknd = (d.dow===0||d.dow===6)?'weekend-col':'';
      if (amt > 0) { total += amt; return `<td class="has-val ${wknd}">${Math.round(amt)}</td>`; }
      return `<td class="zero ${wknd}">–</td>`;
    }).join('');
    if (total === 0) return '';
    return `<tr><td><span style="color:var(--purple)">👤 ${escapeHtml(s.name)}</span></td>${cells}<td class="grid-total-col">₹${Math.round(total).toLocaleString('en-IN')}</td></tr>`;
  }).join('');
  if (!opRows && !stRows) {
    return emptyState('i-cal', 'No data this week', dateDisplay(from) + ' → ' + dateDisplay(to));
  }
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#2563EB,#3B82F6)">
      <div class="rh-l">Week Total</div>
      <div class="rh-v">${money(grandTotal)}</div>
      <div class="rh-s">${dateDisplay(from)} → ${dateDisplay(to)}</div>
      <div class="rh-row">
        <div class="rh-stat"><div class="rl">Operators</div><div class="rv">${money(operatorTotal)}</div></div>
        <div class="rh-stat"><div class="rl">Staff</div><div class="rv">${money(staffTotal)}</div></div>
      </div>
    </div>
    <div class="grid-scroll">
      <table class="grid-table">
        <thead><tr><th>Name</th>${headCols}<th style="background:linear-gradient(180deg,#ECFDF5,#D1FAE5);color:#065F46">Total</th></tr></thead>
        <tbody>${opRows}${stRows}</tbody>
      </table>
    </div>
  `;
}

function buildPnlReport () {
  const s = getFilteredStats();
  const { from, to } = resolveDateRange();
  if (!s.rows.length && !s.expenses.length) return emptyState('i-pnl', 'No data', 'No production or expenses in this range.');
  const byDay = {};
  s.rows.forEach(r => {
    byDay[r.date] = byDay[r.date] || { rev:0, wage:0, exp:0 };
    byDay[r.date].rev  += entryRevenue(r);
    byDay[r.date].wage += entryCost(r);
  });
  s.expenses.forEach(e => {
    byDay[e.date] = byDay[e.date] || { rev:0, wage:0, exp:0 };
    byDay[e.date].exp += Number(e.amount || 0);
  });
  const days = Object.keys(byDay).sort().reverse();
  const dayRows = days.map(d => {
    const row = byDay[d];
    const net = row.rev - row.wage - row.exp;
    const cls = net > 0 ? 'has-val' : (net < 0 ? '' : 'zero');
    const stl = net < 0 ? 'background:rgba(220,38,38,.1);color:#B91C1C;font-weight:700' : '';
    return `<tr>
      <td>${dateShort(d)}</td>
      <td>₹${Math.round(row.rev).toLocaleString('en-IN')}</td>
      <td>₹${Math.round(row.wage).toLocaleString('en-IN')}</td>
      <td>₹${Math.round(row.exp).toLocaleString('en-IN')}</td>
      <td class="${cls}" style="${stl}">₹${Math.round(net).toLocaleString('en-IN')}</td>
    </tr>`;
  }).join('');
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,${s.net >= 0 ? '#059669,#10B981' : '#DC2626,#EF4444'})">
      <div class="rh-l">Net Profit</div>
      <div class="rh-v">${money(s.net)}</div>
      <div class="rh-s">Margin ${s.margin.toFixed(1)}% · ${from === to ? dateDisplay(from) : dateDisplay(from) + ' → ' + dateDisplay(to)}</div>
    </div>
    <div class="pnl-card rev"><div class="pcl">Revenue</div><div class="pcv">${money(s.revenue)}</div><div class="pcs">${s.pieces} pieces produced</div></div>
    <div class="pnl-card wage"><div class="pcl">Operator Wages</div><div class="pcv">${money(s.cost)}</div><div class="pcs">${s.rows.length} entries</div></div>
    <div class="pnl-card exp"><div class="pcl">Expenses</div><div class="pcv">${money(s.expenseTotal)}</div><div class="pcs">${s.expenses.length} entries</div></div>
    <div class="pnl-card net ${s.net < 0 ? 'neg' : ''}">
      <div class="pcl">Net Profit</div><div class="pcv">${money(s.net)}</div>
      <div class="pcs">${s.margin.toFixed(1)}% margin on revenue</div>
    </div>
    <div class="sec-hd" style="padding:16px 20px 8px">Day-by-Day</div>
    <div class="grid-scroll">
      <table class="grid-table">
        <thead><tr><th>Date</th><th>Revenue</th><th>Wages</th><th>Expenses</th><th>Net</th></tr></thead>
        <tbody>${dayRows}</tbody>
      </table>
    </div>
  `;
}

function buildRecurringReport () {
  if (!DB.recurring.length) {
    return `<div class="empty"><div class="eic">${icon('i-repeat')}</div><h4>No recurring expenses</h4><p>Set up daily, weekly, or monthly expenses.</p><button class="btn primary sm" style="margin:0 auto" id="addRecurBtn2">${icon('i-plus')} Add Recurring</button></div>`;
  }
  const activeCount = DB.recurring.filter(r => r.active).length;
  const dailyCost = DB.recurring.filter(r => r.active).reduce((a,r) => {
    if (r.frequency === 'daily') return a + r.amount;
    if (r.frequency === 'weekly') return a + r.amount / 7;
    if (r.frequency === 'monthly') return a + r.amount / 30;
    return a;
  }, 0);
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#DB2777,#F472B6)">
      <div class="rh-l">Active Templates</div>
      <div class="rh-v">${activeCount}</div>
      <div class="rh-s">≈ ${money(dailyCost)} / day · ${money(dailyCost*30)} / mo</div>
    </div>
    <div class="hint" style="margin:0 20px 12px;text-align:left">Auto-created each time the app opens.</div>
    ${DB.recurring.map(r => `
      <div class="report-table" style="margin-bottom:8px">
        <div style="padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer" data-rid="${r.id}">
          <div class="avatar ${r.active?'emerald':'gray'}" style="width:40px;height:40px;border-radius:12px">${icon('i-repeat')}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700">${escapeHtml(r.category)} <span class="recur-chip ${r.active?'':'off'}">${r.active?'ON':'OFF'}</span></div>
            <div style="font-size:11.5px;color:var(--text-3);font-weight:500;margin-top:2px">${escapeHtml(nextRunHint(r))}${r.note ? ' · ' + escapeHtml(r.note) : ''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:15px;font-weight:800;color:var(--orange)">${money(r.amount)}</div>
            <div style="font-size:10.5px;color:var(--text-3);font-weight:700;text-transform:uppercase">${escapeHtml(r.frequency)}</div>
          </div>
        </div>
      </div>
    `).join('')}
    <div style="padding:8px 16px 4px"><button class="btn primary" id="addRecurBtn2">${icon('i-plus')} Add Recurring</button></div>
  `;
}

function buildSalaryReport (rows, from, to) {
  if (!rows.length) return emptyState('i-money', 'No wages', 'No production entries in this range.');
  const byEmp = {};
  rows.forEach(r => {
    if (!byEmp[r.empId]) byEmp[r.empId] = { id:r.empId, name:r.operatorName || '—', line:r.line || '', pieces:0, wages:0, rejects:0, ops:{} };
    byEmp[r.empId].pieces += r.qty;
    byEmp[r.empId].wages += Number(r.amount) || 0;
    byEmp[r.empId].rejects += r.reject || 0;
    byEmp[r.empId].ops[r.operation] = (byEmp[r.empId].ops[r.operation] || 0) + r.qty;
  });
  const list = Object.values(byEmp).sort((a,b) => b.wages - a.wages);
  const total = list.reduce((a,b) => a + b.wages, 0);
  const totalPcs = list.reduce((a,b) => a + b.pieces, 0);
  const totalAdvOutstanding = DB.advances.filter(a => !a.settled && a.personType === 'operator').reduce((s, a) => s + a.amount, 0);
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#059669,#10B981)">
      <div class="rh-l">Operator Wages</div>
      <div class="rh-v">${money(total)}</div>
      <div class="rh-s">${list.length} operator${list.length>1?'s':''} · ${totalPcs} pieces</div>
      ${totalAdvOutstanding > 0 ? `<div class="rh-row"><div class="rh-stat"><div class="rl">Outstanding Advances</div><div class="rv">${money(totalAdvOutstanding)}</div></div></div>` : ''}
    </div>
    ${list.map(emp => {
      const advOut = advanceOutstanding('operator', emp.id);
      const advInPeriod = advanceTotalInPeriod('operator', emp.id, from, to);
      const netPayable = emp.wages - advInPeriod;
      return `
        <div class="salary-section">
          <div class="salary-emp" onclick="this.classList.toggle('expanded')">
            <div class="se-top">
              <div class="se-av">${initials(emp.name)}</div>
              <div class="se-body"><div class="se-name">${escapeHtml(emp.name)}</div><div class="se-info">${escapeHtml(emp.id)} · ${emp.pieces} pcs · ${emp.rejects} rejects${advOut > 0 ? ' · ADV ' + money(advOut) : ''}</div></div>
              <div class="se-amt"><div class="se-net">${money(emp.wages)}</div><div class="se-gross">₹${emp.pieces ? (emp.wages/emp.pieces).toFixed(2) : '0'}/pc avg</div></div>
              <svg class="se-arrow"><use href="#i-chev-down"/></svg>
            </div>
            <div class="se-ops">
              ${Object.entries(emp.ops).map(([op, qty]) => {
                const opRows = rows.filter(r => r.empId === emp.id && r.operation === op);
                const opWages = opRows.reduce((a,b) => a + (Number(b.amount)||0), 0);
                return `<div class="op-line"><span>${escapeHtml(op)} · ${qty} pcs</span><span>${money(opWages)}</span></div>`;
              }).join('')}
              <div class="op-line op-tot"><span>Total wages</span><span>${money(emp.wages)}</span></div>
              ${advInPeriod > 0 ? `<div class="op-line" style="color:#991B1B"><span>Advance this period</span><span>-${money(advInPeriod)}</span></div>` : ''}
              ${advOut > 0 ? `<div class="op-line" style="color:#991B1B"><span>Outstanding advance</span><span>${money(advOut)}</span></div>` : ''}
              <div class="op-line op-tot" style="color:var(--emerald-dk);border-top:2px solid var(--emerald-lt)"><span>Net payable</span><span>${money(netPayable)}</span></div>
            </div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

  hours.forEach(h => {

      <div class="rh-l">Total Staff Pay</div>
      <div class="rh-v">${money(totalAmt)}</div>
      <div class="rh-s">${list.length} staff · ${totalHrs.toFixed(1)} hours</div>
      ${totalAdvOutstanding > 0 ? `<div class="rh-row"><div class="rh-stat"><div class="rl">Outstanding Advances</div><div class="rv">${money(totalAdvOutstanding)}</div></div></div>` : ''}

              <div class="se-amt"><div class="se-net">${money(emp.amount)}</div><div class="se-gross">${emp.days.length} day${emp.days.length>1?'s':''}</div></div>
              <svg class="se-arrow"><use href="#i-chev-down"/></svg>
            </div>
            <div class="se-ops">

                <div class="op-line"><span>${dateShort(d.date)} · ${d.hours}h × ₹${d.hourlyRate.toFixed(2)}</span><span>${money(d.amount)}</span></div>
              `).join('')}
              <div class="op-line op-tot"><span>Total wages</span><span>${money(emp.amount)}</span></div>
              ${advInPeriod > 0 ? `<div class="op-line" style="color:#991B1B"><span>Advance this period</span><span>-${money(advInPeriod)}</span></div>` : ''}
              ${advOut > 0 ? `<div class="op-line" style="color:#991B1B"><span>Outstanding advance</span><span>${money(advOut)}</span></div>` : ''}

function buildDailyReport (rows) {
  if (!rows.length) return emptyState('i-cal', 'No production', 'No production entries in this range.');
  const byDay = {};
  rows.forEach(r => {
    if (!byDay[r.date]) byDay[r.date] = { pieces:0, rejects:0, wages:0, entries:0 };
    byDay[r.date].pieces += r.qty;
    byDay[r.date].rejects += r.reject || 0;
    byDay[r.date].wages += Number(r.amount) || 0;
    byDay[r.date].entries += 1;
  });
  const days = Object.keys(byDay).sort().reverse();
  const totalPieces = days.reduce((a,d) => a + byDay[d].pieces, 0);
  const totalWages = days.reduce((a,d) => a + byDay[d].wages, 0);
  const totalRej = days.reduce((a,d) => a + byDay[d].rejects, 0);
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#0891B2,#06B6D4)">
      <div class="rh-l">Total Output</div>
      <div class="rh-v">${totalPieces.toLocaleString('en-IN')} pcs</div>
      <div class="rh-s">${days.length} day${days.length>1?'s':''} · ${money(totalWages)} wages · ${totalRej} rejects</div>
    </div>
    <div class="grid-scroll">
      <table class="grid-table">
        <thead><tr><th>Date</th><th>Pieces</th><th>Rejects</th><th>Wages</th></tr></thead>
        <tbody>${days.map(d => `
          <tr><td>${dateShort(d)}</td><td>${byDay[d].pieces}</td><td>${byDay[d].rejects}</td><td>₹${Math.round(byDay[d].wages).toLocaleString('en-IN')}</td></tr>
        `).join('')}</tbody>
      </table>
    </div>
  `;
}

function buildOperatorReport (rows) {
  if (!rows.length) return emptyState('i-users', 'No operator data', 'No production entries in this range.');
  const byEmp = {};
  rows.forEach(r => {
    if (!byEmp[r.empId]) byEmp[r.empId] = { name:r.operatorName || '—', line:r.line || '', pieces:0, rejects:0, wages:0 };
    byEmp[r.empId].pieces += r.qty;
    byEmp[r.empId].rejects += r.reject || 0;
    byEmp[r.empId].wages += Number(r.amount) || 0;
  });
  const list = Object.entries(byEmp).sort((a,b) => b[1].pieces - a[1].pieces);
  const totalPieces = rows.reduce((a,b)=>a+b.qty,0);
  const totalWages = rows.reduce((a,b)=>a+(Number(b.amount)||0),0);
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#D97706,#F59E0B)">
      <div class="rh-l">Operators</div>
      <div class="rh-v">${list.length}</div>
      <div class="rh-s">${totalPieces} pieces · ${money(totalWages)} wages</div>
    </div>
    <div class="grid-scroll">
      <table class="grid-table">
        <thead><tr><th>Operator</th><th>Line</th><th>Pieces</th><th>Rejects</th><th>Wages</th></tr></thead>
        <tbody>${list.map(([empId, emp]) => `
          <tr>
            <td>${escapeHtml(emp.name)}<div style="font-size:9px;color:var(--text-3);font-weight:500">${escapeHtml(empId)}</div></td>
            <td>${escapeHtml(emp.line)}</td>
            <td>${emp.pieces}</td>
            <td>${emp.rejects}</td>
            <td>₹${Math.round(emp.wages).toLocaleString('en-IN')}</td>
          </tr>
        `).join('')}</tbody>
      </table>
    </div>
  `;
}

function buildBundleReport (rows) {
  if (!rows.length) return emptyState('i-bundle', 'No bundle data', 'No production entries in this range.');
  const activeBundles = DB.bundles.filter(b => rows.some(r => r.bundleId === b.id));
  if (!activeBundles.length) return emptyState('i-bundle', 'No bundle data', 'No production entries in this range.');
  const acc = isAccount();
  const items = activeBundles.map(b => {
    const bRows = rows.filter(r => r.bundleId === b.id);
    const pieces = bRows.reduce((a,r) => a + r.qty, 0);
    const wages = bRows.reduce((a,r) => a + (Number(r.amount)||0), 0);
    const rejects = bRows.reduce((a,r) => a + (r.reject||0), 0);
    const revenue = acc ? bRows.reduce((a,r) => a + entryRevenue(r), 0) : 0;
    const margin = revenue - wages;
    return { b, pieces, wages, rejects, revenue, margin };
  }).sort((a,b) => b.pieces - a.pieces);
  const totalPcs = items.reduce((a,b) => a + b.pieces, 0);
  const totalWages = items.reduce((a,b) => a + b.wages, 0);
  const totalMargin = items.reduce((a,b) => a + b.margin, 0);
  const head = acc
    ? `<tr><th>Bundle</th><th>Pieces</th><th>Rejects</th><th>Wages</th><th>Revenue</th><th>Margin</th></tr>`
    : `<tr><th>Bundle</th><th>Pieces</th><th>Rejects</th><th>Wages</th></tr>`;
  const bodyRows = items.map(it => {
    if (acc) {
      const cls = it.margin >= 0 ? 'has-val' : '';
      const stl = it.margin < 0 ? 'background:rgba(220,38,38,.1);color:#B91C1C;font-weight:700' : '';
      return `<tr>
        <td>${escapeHtml(it.b.name)}<div style="font-size:9px;color:var(--text-3);font-weight:500">₹${it.b.sellingPrice||0}/pc sell</div></td>
        <td>${it.pieces}</td><td>${it.rejects}</td>
        <td>₹${Math.round(it.wages).toLocaleString('en-IN')}</td>
        <td>₹${Math.round(it.revenue).toLocaleString('en-IN')}</td>
        <td class="${cls}" style="${stl}">₹${Math.round(it.margin).toLocaleString('en-IN')}</td>
      </tr>`;
    }
    return `<tr>
      <td>${escapeHtml(it.b.name)}<div style="font-size:9px;color:var(--text-3);font-weight:500">₹${bundleCostPerPiece(it.b)}/pc cost</div></td>
      <td>${it.pieces}</td><td>${it.rejects}</td>
      <td>₹${Math.round(it.wages).toLocaleString('en-IN')}</td>
    </tr>`;
  }).join('');
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#65A30D,#84CC16)">
      <div class="rh-l">Total Bundle Output</div>
      <div class="rh-v">${totalPcs.toLocaleString('en-IN')} pcs</div>
      <div class="rh-s">${items.length} bundle${items.length>1?'s':''} · ${money(totalWages)} wages${acc ? ' · ' + money(totalMargin) + ' margin' : ''}</div>
    </div>
    <div class="grid-scroll">
      <table class="grid-table"><thead>${head}</thead><tbody>${bodyRows}</tbody></table>
    </div>
  `;
}

function buildOperationReport (rows) {
  if (!rows.length) return emptyState('i-chart', 'No operation data', 'No production entries in this range.');
  const byOp = {};
  rows.forEach(r => {
    if (!byOp[r.operation]) byOp[r.operation] = { pieces:0, rejects:0, wages:0, ops:new Set() };
    byOp[r.operation].pieces += r.qty;
    byOp[r.operation].rejects += r.reject || 0;
    byOp[r.operation].wages += Number(r.amount) || 0;
    byOp[r.operation].ops.add(r.empId);
  });
  const list = Object.entries(byOp).sort((a,b) => b[1].pieces - a[1].pieces);
  const totalPcs = rows.reduce((a,b)=>a+b.qty,0);
  const totalWages = rows.reduce((a,b)=>a+(Number(b.amount)||0),0);
  return `
    <div class="report-hero" style="background:linear-gradient(135deg,#DC2626,#EF4444)">
      <div class="rh-l">Operations</div>
      <div class="rh-v">${list.length}</div>
      <div class="rh-s">${totalPcs} pieces · ${money(totalWages)} wages</div>
    </div>
    <div class="grid-scroll">
      <table class="grid-table">
        <thead><tr><th>Operation</th><th>Pieces</th><th>Rejects</th><th>Operators</th><th>Wages</th></tr></thead>
        <tbody>${list.map(([op, d]) => `
          <tr>
            <td>${escapeHtml(op)}</td>
            <td>${d.pieces}</td>
            <td>${d.rejects}</td>
            <td>${d.ops.size}</td>
            <td>₹${Math.round(d.wages).toLocaleString('en-IN')}</td>
          </tr>
        `).join('')}</tbody>
      </table>
    </div>
  `;
}

function emptyState (iconId, title, text) {
  return `<div class="empty"><div class="eic">${icon(iconId)}</div><h4>${escapeHtml(title)}</h4><p>${escapeHtml(text)}</p><p style="font-size:12px;color:var(--text-3);margin-top:6px">Try widening the date range with the chips above.</p></div>`;
}

function shareReport () { toast('Use PDF button or screenshot'); }

function openSettingsSheet () {
  const days = !META.lastBackup ? Infinity : Math.floor((Date.now() - META.lastBackup) / 86400000);
  const backupLabel = days === Infinity ? 'Never' : days === 0 ? 'Today' : days === 1 ? 'Yesterday' : days + ' days ago';
  const statusLabel = { idle:'Ready', pulling:'Pulling…', pushing:'Pushing…', synced:'Synced', error:'Error: ' + (Sync.lastError || 'unknown') }[Sync.status] || Sync.status;
  const pinSection = isAdmin()
    ? `<div class="field"><label>Admin PIN</label><button class="btn gray sm" id="changeAdminPin" style="width:100%">Change Admin PIN</button><div class="hint">Account PIN can only be changed by the Account user.</div></div>`
    : `<div class="field"><label>Account PIN</label><button class="btn gray sm" id="changeAccountPin" style="width:100%">Change Account PIN</button><div class="hint">Admin PIN can only be changed by the Admin user.</div></div>`;
  const html = `
    <div class="field">
      <label>Cloud Sync Status</label>
      <div style="padding:14px;background:var(--surface-2);border-radius:12px">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:8px"><span style="color:var(--text-3)">State</span><b>${escapeHtml(statusLabel)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:8px"><span style="color:var(--text-3)">Last pull</span><b>${Sync.lastPull ? timeShort(Sync.lastPull) : '—'}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:500"><span style="color:var(--text-3)">Last push</span><b>${Sync.lastPush ? timeShort(Sync.lastPush) : '—'}</b></div>
      </div>
    </div>
    <div class="field">
      <label>Manual Sync</label>
      <button class="btn blue" id="syncPullBtn" style="margin-bottom:8px">${icon('i-cloud-down')} Pull</button>
      <button class="btn emerald" id="syncPushBtn">${icon('i-cloud-up')} Push</button>
    </div>
    <div class="field">
      <label>Local Backup</label>
      <button class="btn gray" id="doBackupBtn" style="margin-bottom:8px">${icon('i-download')} Export backup file</button>
      <button class="btn outline" id="doRestoreBtn">${icon('i-upload')} Restore from backup</button>
      <div class="hint">Last file backup: <b>${escapeHtml(backupLabel)}</b></div>
    </div>
    ${pinSection}
    <div class="field">
      <label>Danger zone</label>
      <button class="btn red" id="doClearBtn">${icon('i-trash')} Clear all data</button>
    </div>
  `;
  openSheet('Settings', html, null);
  setTimeout(() => {
    $('#syncPullBtn').addEventListener('click', async () => { closeSheet(); await Sync.pull(false); });
    $('#syncPushBtn').addEventListener('click', async () => { closeSheet(); await Sync.push(true); });
    $('#doBackupBtn').addEventListener('click', backupNow);
    $('#doRestoreBtn').addEventListener('click', pickRestoreFile);
    $('#doClearBtn').addEventListener('click', confirmClearAll);
    const ap = $('#changeAdminPin'); if (ap) ap.addEventListener('click', () => openPinChangeSheet('admin'));
    const cp = $('#changeAccountPin'); if (cp) cp.addEventListener('click', () => openPinChangeSheet('account'));
  }, 60);
}
window.openSettingsSheet = openSettingsSheet;

function openPinChangeSheet (role) {
  if (role === 'admin' && !isAdmin())   { toast('Account cannot change Admin PIN', {success:false}); return; }
  if (role === 'account' && !isAccount()) { toast('Admin cannot change Account PIN', {success:false}); return; }
  const current = role === 'admin' ? DB.admin.pin : DB.account.pin;
  const title = role === 'admin' ? 'Change Admin PIN' : 'Change Account PIN';
  const html = `
    <div class="field"><label>Current PIN</label><input id="pinCurrent" type="tel" inputmode="numeric" maxlength="4" placeholder="••••"></div>
    <div class="field"><label>New PIN</label><input id="pinNew" type="tel" inputmode="numeric" maxlength="4" placeholder="••••"></div>
    <div class="field"><label>Confirm</label><input id="pinConfirm" type="tel" inputmode="numeric" maxlength="4" placeholder="••••"></div>
  `;
  openSheet(title, html, () => {
    const cur = ($('#pinCurrent').value || '').trim();
    const nw  = ($('#pinNew').value || '').trim();
    const cf  = ($('#pinConfirm').value || '').trim();
    if (cur !== current)   { toast('Current PIN is wrong', {success:false}); return false; }
    if (!/^\d{4}$/.test(nw)) { toast('New PIN must be 4 digits', {success:false}); return false; }
    if (nw !== cf)         { toast('PINs do not match', {success:false}); return false; }
    if (role === 'admin') DB.admin.pin = nw; else DB.account.pin = nw;
    save(); toast('PIN updated'); return true;
  });
}

setLoginRole('admin');
updatePinSlots();

$$('#segTeam .filter-chip').forEach(b => b.addEventListener('click', () => {
  $$('#segTeam .filter-chip').forEach(x => x.classList.remove('on'));

$$('#segWork .filter-chip').forEach(b => b.addEventListener('click', () => {

  b.classList.add('on'); workFilter = b.dataset.f; renderWork();

setInterval(() => {
  const created = processRecurring();
  if (created > 0) {
    toast(created + ' recurring expense' + (created > 1 ? 's' : '') + ' added');
    if (currentScreen === 'home') renderHome();
    if (currentReport === 'recurring') renderReportContent();

}, 60 * 1000);

  if (document.visibilityState === 'visible') {
    Sync.pull(true);
    const created = processRecurring();
    if (created > 0) {
      toast(created + ' recurring expense' + (created > 1 ? 's' : '') + ' added');
